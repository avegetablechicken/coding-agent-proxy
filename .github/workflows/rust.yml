name: Rust
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python scripts/integration.py
      - run: python scripts/test_proxy_auth.py
      - run: python scripts/test_service_rust.py
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: coding-agent-proxy-${{ matrix.os }}
          path: |
            target/release/coding-agent-proxy
            target/release/coding-agent-proxy.exe
          if-no-files-found: error
