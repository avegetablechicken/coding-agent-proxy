# Copy to config.yaml. YAML is loaded once; restart after changing it.
listen_port: 8787
auth_file: "~/.codex/auth.json"
# Default true: only accept the ChatGPT credential saved in auth_file.
# Set false to route other ChatGPT access tokens; auth_file becomes optional.
account_auth_file_only: true
request_timeout_seconds: 300

base_url:
  account: "https://chatgpt.com/backend-api"
  api_key: "https://api.openai.com/v1"

# HTTP CONNECT, HTTPS CONNECT or SOCKS5; an explicit port is required.
# Optional username/password: http://user:password@host:port
# Percent-encode reserved credential characters, e.g. @ -> %40.
proxies:
  us: "http://127.0.0.1:8101"
  jp: "socks5://127.0.0.1:8102"
  # authenticated: "http://proxy-user:proxy-password@proxy.example.com:8080"

routing:
  account:
    "you@example.com": us
    "replace-with-jp-account-id": jp

  # Keys are Codex provider IDs or environment variable names, not secret values.
  # Provider IDs are matched first. Unknown variable names use base_url.api_key.
  # api_key:
  #   ShareCoder: none
  #   OPENAI_API_KEY: us
  #   SECOND_OPENAI_API_KEY: [jp, us]

  # All fallback fields reference proxies above, or none for explicit direct access.
  # Account: only a verified ChatGPT token without an account mapping can use it.
  # account_fallback: jp
  # API Key: unmatched Bearer tokens go to base_url.api_key; missing auth is refused.
  # api_key_fallback: us
  # Public MCP: no matching credential route; omitted/null/none means direct.
  # mcp_fallback: jp

# Any routing proxy value also accepts ordered candidates, for example:
# routing.account.<account-id>: [jp, us]
# routing.api_key.OPENAI_API_KEY: [us, jp]
# routing.account_fallback: [jp, us]
# routing.api_key_fallback: [us, jp, none]
# routing.mcp_fallback: [jp, none]
# Lists probe the upstream origin before sending each request. All failed -> 502.
