# Copy to config.yaml. YAML is loaded once; restart after changing it.
listen_port: 8787
auth_file: "~/.codex/auth.json"
request_timeout_seconds: 300

base_url:
  account: "https://chatgpt.com/backend-api"
  api_key: "https://api.openai.com/v1"

# HTTP CONNECT, HTTPS CONNECT or SOCKS5; an explicit port is required.
# Optional username/password: http://user:password@host:port
# Percent-encode reserved credential characters, e.g. @ -> %40.
proxies:
  us: "http://127.0.0.1:8101"
  jp: "socks5://127.0.0.1:8102"
  # authenticated: "http://proxy-user:proxy-password@proxy.example.com:8080"

routing:
  account:
    "replace-with-us-account-id": us
    "replace-with-jp-account-id": jp

  # Optional: uses env_key from the named Codex provider (openai -> OPENAI_API_KEY).
  # Each entry may use api_key_env OR api_key_file. Keys must be distinct.
  # api_key:
  #   - name: openai
  #     proxy: us
  #   - name: openai
  #     api_key_env: SECOND_OPENAI_API_KEY
  #     proxy: jp
  #   - name: provider-a
  #     api_key_file: "~/.config/coding-agent-proxy/provider-a.key"
  #     upstream_base_url: "https://a.example.com/v1"
  #     proxy: us

  # All fallback fields reference proxies above, or none for explicit direct access.
  # Account: only a verified ChatGPT token without an account mapping can use it.
  # account_fallback: jp
  # API Key: unmatched Bearer tokens go to base_url.api_key; missing auth is refused.
  # api_key_fallback: us
  # Public MCP: no matching credential route; omitted/null/none means direct.
  # mcp_fallback: jp
